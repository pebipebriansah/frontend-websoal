<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Kelola Description Materi</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Supabase JS -->
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
</head>

<body class="bg-gray-50 font-sans p-6">

  <div class="max-w-6xl mx-auto">
    <h1 class="text-3xl font-bold text-gray-800 text-center mb-8">
      Kelola Description Materi
    </h1>

    <!-- ================= FORM ================= -->
    <form id="formDescription" class="bg-white p-6 rounded-xl shadow-md mb-6 space-y-6" enctype="multipart/form-data">

      <!-- Info Mode -->
      <div id="infoMode"
        class="hidden bg-yellow-50 border border-yellow-300 text-yellow-700 px-4 py-2 rounded-lg text-sm">
        Mode Update: data description untuk materi ini sudah ada
      </div>

      <!-- Pilih Materi -->
      <div>
        <label for="selectMateri" class="block text-sm font-semibold mb-2 text-gray-700">
          Pilih Materi
        </label>
        <select id="selectMateri" class="border border-gray-300 rounded-lg p-3 w-full">
          <option value="">-- Pilih Materi --</option>
        </select>
      </div>

      <!-- Deskripsi -->
      <div>
        <label for="description" class="block text-sm font-semibold mb-2 text-gray-700">
          Deskripsi Materi
        </label>
        <textarea id="description" class="border border-gray-300 rounded-lg p-3 w-full h-32"
          placeholder="Tulis deskripsi materi..."></textarea>
      </div>

      <!-- Upload Image -->
      <div>
        <label for="imageFile" class="block text-sm font-semibold mb-2 text-gray-700">
          Upload Gambar
        </label>
        <input type="file" id="imageFile" accept="image/*" class="block">

        <!-- Preview Image -->
        <img id="previewImage" class="mt-3 w-40 rounded border hidden" alt="Preview Gambar">
      </div>

      <!-- Upload Voice -->
      <div>
        <label for="voiceFile" class="block text-sm font-semibold mb-2 text-gray-700">
          Upload Suara
        </label>
        <input type="file" id="voiceFile" accept="audio/*" class="block">

        <!-- Preview Audio -->
        <audio id="previewVoice" controls class="mt-3 w-full hidden">
        </audio>
      </div>

      <!-- Action -->
      <div class="flex gap-3">
        <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-3 rounded-lg font-semibold">
          Simpan Description
        </button>

        <button type="button" id="btnCancel"
          class="hidden bg-gray-400 hover:bg-gray-500 text-white px-6 py-3 rounded-lg">
          Batal
        </button>
      </div>

      <!-- Hidden -->
      <input type="hidden" id="idDescription">
    </form>

    <!-- ================= TABLE ================= -->
    <div class="bg-white p-6 rounded-xl shadow-md overflow-x-auto">
      <table class="min-w-full divide-y">
        <thead class="bg-gray-100">
          <tr>
            <th class="px-5 py-3 text-left">ID</th>
            <th class="px-5 py-3 text-left">Materi</th>
            <th class="px-5 py-3 text-left">Deskripsi</th>
            <th class="px-5 py-3 text-left">Image</th>
            <th class="px-5 py-3 text-left">Voice</th>
            <th class="px-5 py-3 text-left">Aksi</th>
          </tr>
        </thead>

        <tbody id="tabelDescription">
          <tr>
            <td colspan="6" class="text-center text-gray-400 py-6">
              Memuat data...
            </td>
          </tr>
        </tbody>
      </table>

      <div id="pagination" class="flex justify-center mt-4 gap-2"></div>
    </div>
  </div>

  <!-- ❗ description.js dipanggil oleh main.js -->
</body>

</html>
